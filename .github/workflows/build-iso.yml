name: Build iso
on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install VMware PowerCLI
      shell: pwsh
      run: |
            Set-PSRepository -Name "PSGallery" -InstallationPolicy Trusted
            Install-Module -Name VMware.PowerCLI -Scope CurrentUser -Force -Confirm:$false -AllowClobber

    - name: Install Python
      shell: pwsh
      run: |
            $pythonPath = "C:\Python311\python.exe"
            if (-not (Test-Path $pythonPath)) {
                Write-Host "Installing Python 3.11..."
                Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.6/python-3.11.6-amd64.exe" -OutFile "$env:TEMP\python-3.11.6-amd64.exe"
                Start-Process "$env:TEMP\python-3.11.6-amd64.exe" -ArgumentList "/quiet InstallAllUsers=1 PrependPath=1" -Wait
            }
            Write-Host "Installing required Python modules for ImageBuilder..."
            & $pythonPath -m pip install --upgrade pip
            & $pythonPath -m pip install six lxml psutil pyopenssl --quiet
            Write-Host "Configuring PowerCLI to use Python..."
            Set-PowerCLIConfiguration -Scope User -PythonPath $pythonPath -Confirm:$false
    
    - name: Download zip
      shell: pwsh
      run: |
            Invoke-WebRequest -Uri "https://github.com/mufeng05/r8168-esxi/releases/download/ESXi670-202503001/ESXi670-202503001.zip" -OutFile "ESXi670-202503001.zip"
            ls

    - name: Create ISO with driver
      shell: pwsh
      run: |
            Add-EsxSoftwareDepot "ESXi670-202503001.zip"
            Add-EsxSoftwareDepot "vib-r8168.zip"
            Start-Sleep 2
            $imageProfile = (Get-EsxImageProfile |
            Where-Object { $_.Name -like "ESXi-$baseESXiVer*-standard*" } |
            Sort-Object -Property CreationTime -Descending |
            Select-Object -First 1).Name
            $newProfileName = $($imageProfile.Replace("standard", "r8168"))
            $newProfile = New-EsxImageProfile -CloneProfile $imageProfile -name $newProfileName
            Set-EsxImageProfile -ImageProfile $newProfile -AcceptanceLevel CommunitySupported
            Add-EsxSoftwarePackage -ImageProfile $newProfile -SoftwarePackage "net55-r8168" -Force
            Export-ESXImageProfile -ImageProfile $newProfile -ExportToIso -filepath "$newProfileName.iso" -Force

    